<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Zero Lab icon: a generic tiny green single-board computer with a happy face. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4f6"/>
      <stop offset="1" stop-color="#ffd9e2"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43b45c"/>
      <stop offset="1" stop-color="#2a8a43"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#aeb6c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#8d1235" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS-style rounded square -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g transform="rotate(-6 512 520)" filter="url(#shadow)">
    <!-- board: Pi Zero proportions, rounded corners -->
    <rect x="152" y="348" width="720" height="332" rx="44" fill="url(#pcb)" stroke="#1f6e34" stroke-width="8"/>
    <!-- mounting holes -->
    <g fill="#fff4f6" stroke="#d9b45a" stroke-width="10">
      <circle cx="200" cy="396" r="20"/><circle cx="824" cy="396" r="20"/>
      <circle cx="200" cy="632" r="20"/><circle cx="824" cy="632" r="20"/>
    </g>
    <!-- 2x20 header, shown as two rows of gold pads -->
    <g fill="#e9c25b" stroke="#b58b26" stroke-width="3">
      <g id="row">
        <circle cx="262" cy="380" r="9"/><circle cx="294" cy="380" r="9"/><circle cx="326" cy="380" r="9"/>
        <circle cx="358" cy="380" r="9"/><circle cx="390" cy="380" r="9"/><circle cx="422" cy="380" r="9"/>
        <circle cx="454" cy="380" r="9"/><circle cx="486" cy="380" r="9"/><circle cx="518" cy="380" r="9"/>
        <circle cx="550" cy="380" r="9"/><circle cx="582" cy="380" r="9"/><circle cx="614" cy="380" r="9"/>
        <circle cx="646" cy="380" r="9"/><circle cx="678" cy="380" r="9"/><circle cx="710" cy="380" r="9"/>
        <circle cx="742" cy="380" r="9"/><circle cx="774" cy="380" r="9"/>
      </g>
      <use href="#row" y="30"/>
    </g>
    <!-- SD slot (left edge) and connectors (bottom edge) -->
    <rect x="132" y="470" width="44" height="96" rx="10" fill="url(#metal)" stroke="#7c8594" stroke-width="5"/>
    <rect x="236" y="650" width="110" height="46" rx="10" fill="url(#metal)" stroke="#7c8594" stroke-width="5"/>
    <rect x="602" y="654" width="70" height="40" rx="10" fill="url(#metal)" stroke="#7c8594" stroke-width="5"/>
    <rect x="712" y="654" width="70" height="40" rx="10" fill="url(#metal)" stroke="#7c8594" stroke-width="5"/>
    <!-- a few traces -->
    <g fill="none" stroke="#7fd08f" stroke-width="5" stroke-linecap="round" opacity=".55">
      <path d="M290 640 V600 H360"/><path d="M640 650 V610 H600"/><path d="M745 650 V590 H700"/>
    </g>

    <!-- face -->
    <g>
      <ellipse cx="430" cy="522" rx="40" ry="50" fill="#1f1a24"/>
      <ellipse cx="594" cy="522" rx="40" ry="50" fill="#1f1a24"/>
      <circle cx="444" cy="502" r="15" fill="#fff"/><circle cx="420" cy="540" r="7" fill="#fff"/>
      <circle cx="608" cy="502" r="15" fill="#fff"/><circle cx="584" cy="540" r="7" fill="#fff"/>
      <ellipse cx="368" cy="584" rx="34" ry="20" fill="#ff7a9c" opacity=".75"/>
      <ellipse cx="656" cy="584" rx="34" ry="20" fill="#ff7a9c" opacity=".75"/>
      <path d="M478 588 Q512 626 546 588" fill="none" stroke="#1f1a24" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <!-- a little raspberry friend (generic fruit) -->
  <g transform="translate(748 222) rotate(16)">
    <path d="M0 -84 L12 -62 L40 -70 L26 -50 L52 -40 L22 -38 L0 -54 L-22 -38 L-52 -40 L-26 -50 L-40 -70 L-12 -62 Z" fill="#3b9a4b" stroke="#2a7a39" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#e0245e" stroke="#a3123f" stroke-width="4">
      <circle cx="-36" cy="-40" r="17"/><circle cx="-12" cy="-40" r="17"/><circle cx="12" cy="-40" r="17"/><circle cx="36" cy="-40" r="17"/><circle cx="-48" cy="-14" r="17"/><circle cx="-24" cy="-14" r="17"/><circle cx="0" cy="-14" r="17"/><circle cx="24" cy="-14" r="17"/><circle cx="48" cy="-14" r="17"/><circle cx="-36" cy="12" r="17"/><circle cx="-12" cy="12" r="17"/><circle cx="12" cy="12" r="17"/><circle cx="36" cy="12" r="17"/><circle cx="-30" cy="38" r="17"/><circle cx="-6" cy="38" r="17"/><circle cx="18" cy="38" r="17"/><circle cx="-12" cy="62" r="17"/><circle cx="12" cy="62" r="17"/><circle cx="-6" cy="82" r="17"/>
    </g>
    <g fill="#fff" opacity=".75"><circle cx="-40" cy="-46" r="5"/><circle cx="-52" cy="-20" r="5"/><circle cx="-46" cy="6" r="4"/></g>
  </g>
</svg>
