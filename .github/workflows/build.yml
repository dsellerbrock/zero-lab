# Builds every Zero Lab download (macOS dmg, Windows setup.exe, Linux AppImage) from this repository alone
# (inputs pinned in tools/pins.sh), installs each one the way a friend would and runs the e2e against it.
# Pull requests get the builds and e2e as checks. On main, when mac/Info.plist has a version with no release
# yet and every e2e is green, the release job publishes it; the website (pisim.ellerbrock.dev) reads
# releases/latest of this repository, so it updates by itself. To release: a PR that bumps the version.
name: Build installers
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:  # a newer push to the same PR replaces its running build; main runs are never cancelled
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools
      - run: python3 -m unittest discover -s tests

  kernel:  # the Pi OS 6.18.50 kernel with virtio built in; rebuilt only when its recipe changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: kernel/kernel8-virtio.img
          key: kernel-${{ hashFiles('kernel/config', 'kernel/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ZL_JOBS=4 kernel/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: kernel, path: kernel/kernel8-virtio.img, if-no-files-found: error }
      - name: The kernel's GPL source (a release asset of its own; 157 MB)
        run: |
          kernel/build.sh source
          V=$(python3 -c 'import plistlib; print(plistlib.load(open("mac/Info.plist","rb"))["CFBundleShortVersionString"])')
          tar -cf "Zero-Lab-$V-kernel-source.tar" kernel/src kernel/build.sh kernel/config
      - uses: actions/upload-artifact@v4
        with: { name: kernel-source, path: Zero-Lab-*-kernel-source.tar, if-no-files-found: error }

  macos:  # Zero-Lab-<v>-macOS-arm64.dmg (needs the macOS 26 SDK: an Apple Silicon macOS 26+ runner)
    needs: [test, kernel]
    runs-on: macos-latest  # macOS 26 on Apple Silicon since mid-2026; the first step checks
    steps:
      - name: Runner is Apple Silicon with macOS 26+
        run: |
          sw_vers; uname -m; xcrun --show-sdk-version
          [ "$(uname -m)" = arm64 ] && [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ] && [ "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 26 ]
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel }
      - run: brew install meson ninja pkg-config glib pixman libslirp librsvg
      - run: ZL_JOBS=3 mac/build-bundle.sh all
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, path: build/mac/Zero-Lab-*-macOS-arm64.dmg, if-no-files-found: error }

  appimage:  # Zero-Lab-<v>-linux-x86_64.AppImage + its GPL/LGPL source tar (built in ubuntu:22.04 with podman)
    needs: [test, kernel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel }
      - run: ZL_JOBS=4 tools/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            build/appimage/Zero-Lab-*-linux-x86_64.AppImage
            build/appimage/Zero-Lab-*-linux-x86_64-source.tar
          if-no-files-found: error

  windows:  # Zero-Lab-<v>-windows-x64-setup.exe (per-user install wizard) + its GPL sources zip
    needs: [test, kernel]
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44@sha256:6ad1739ac6fb30f72ecc7b62a7ca94871d1cab215e4f5174113941047e0b4ed4  # = ZL_WIN_IMAGE in tools/pins.sh
    steps:
      - run: dnf -y -q install git  # so the checkout is a git repo (the source bundle archives HEAD)
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel }
      - run: ZL_JOBS=4 tools/make-windows-installer.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/windows/Zero-Lab-*-windows-x64-setup.exe
            build/windows/Zero-Lab-*-windows-x64-sources.zip
          if-no-files-found: error

  # Dead-on-arrival checks: install each download the way a friend would, then run tests/e2e.py against
  # that installed copy (provision, boot, screenshot, Files, every sample). Separate from the build jobs, so
  # a flaky runner never blocks the artifacts; a release still needs every e2e job green (docs/BUILDING.md).
  # Runners have no Apple Hypervisor (no nested virt) and no GPU for Venus: TCG + soft graphics everywhere.
  macos-e2e:
    needs: macos
    runs-on: macos-latest
    timeout-minutes: 60
    env: { ZL: "/Users/runner/zl" }  # throwaway HOME + TMPDIR (short: QEMU's unix sockets live in TMPDIR)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: macos-dmg, path: dl }
      - name: Install Zero Lab.app from the dmg into a throwaway Applications folder
        run: |
          df -h /; sysctl -n hw.ncpu hw.memsize
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dl/Zero-Lab-*-macOS-arm64.dmg
          mkdir -p "$ZL/Applications"
          ditto "$RUNNER_TEMP/dmg/Zero Lab.app" "$ZL/Applications/Zero Lab.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - id: img  # the Pi OS download is cached per image URL: 1.4 GB, or a minute of the job
        run: echo "name=$(python3 -c 'import sys; sys.path[:0] = ["app"]; import image; print(next(e["url"] for e in image.CATALOG if e["id"] == "desktop").rsplit("/", 1)[1])')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/zl/home/Library/Application Support/Zero Lab/cache
          key: ${{ runner.os }}-${{ steps.img.outputs.name }}
      - name: Start the installed engine headless, run the e2e
        shell: bash  # -o pipefail: tee must not hide the e2e's exit status
        run: |
          R="$ZL/Applications/Zero Lab.app/Contents/Resources"
          D="$ZL/home/Library/Application Support/Zero Lab"
          mkdir -p "$D" "$ZL/home/Downloads" "$ZL/tmp"
          echo '{"accel": "tcg", "gpu": "soft"}' > "$D/config.json"
          HOME="$ZL/home" TMPDIR="$ZL/tmp" ZL_QEMU_DIR="$R/qemu" PYTHONDONTWRITEBYTECODE=1 \
            "$R/python/bin/python3" -E -s "$R/app/server.py" --port 8642 > "$ZL/tmp/engine.log" 2>&1 &
          for i in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8642/ && break
            kill -0 $! 2>/dev/null || { cat "$ZL/tmp/engine.log"; exit 1; }
            sleep 1
          done
          python3 tests/e2e.py --provision desktop --gpu soft --accel tcg --cpus 2 | tee "$ZL/tmp/e2e.log"  # 3-core runner
      - id: cached
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: ls "$ZL/home/Library/Application Support/Zero Lab/cache/"*.ok && echo ok=true >> "$GITHUB_OUTPUT"
      - if: always() && steps.cached.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/zl/home/Library/Application Support/Zero Lab/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: failure()
        run: grep '^{' "$ZL/tmp/e2e.log" | tail -1 > "$ZL/tmp/e2e.json"; df -h /
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-logs
          path: |
            /Users/runner/zl/tmp/*.log
            /Users/runner/zl/tmp/*.json
            /Users/runner/zl/tmp/zl-*/*.log
            /Users/runner/zl/tmp/zl-*/*.png
            /Users/runner/zl/tmp/zl-*/argv.json

  appimage-e2e:
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: { ZL: "/mnt/zl" }  # throwaway HOME + TMPDIR (the Pi image takes ~15 GB)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: appimage, path: dl }
      - name: FUSE (as on any desktop; the AppImage mounts itself) and a scratch folder
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
          sudo mkdir -p "$ZL" && sudo chown "$USER" "$ZL"
          df -h / /mnt
          chmod +x dl/Zero-Lab-*-linux-x86_64.AppImage
      - id: img
        run: echo "name=$(python3 -c 'import sys; sys.path[:0] = ["app"]; import image; print(next(e["url"] for e in image.CATALOG if e["id"] == "desktop").rsplit("/", 1)[1])')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/zl/home/.local/share/zero-lab/cache
          key: ${{ runner.os }}-${{ steps.img.outputs.name }}
      - name: Start the AppImage headless, run the e2e
        shell: bash
        run: |
          mkdir -p "$ZL/home/.local/share/zero-lab" "$ZL/home/Downloads" "$ZL/tmp"
          echo '{"accel": "tcg", "gpu": "soft"}' > "$ZL/home/.local/share/zero-lab/config.json"
          # No DISPLAY: AppRun skips its terminal and app-menu prompts. BROWSER=true swallows its --open.
          env -u XDG_DATA_HOME HOME="$ZL/home" TMPDIR="$ZL/tmp" BROWSER=true \
            dl/Zero-Lab-*-linux-x86_64.AppImage --port 8642 > "$ZL/tmp/engine.log" 2>&1 &
          for i in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8642/ && break
            kill -0 $! 2>/dev/null || { cat "$ZL/tmp/engine.log"; exit 1; }
            sleep 1
          done
          python3 tests/e2e.py --provision desktop --gpu soft --accel tcg | tee "$ZL/tmp/e2e.log"
      - id: cached
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: ls "$ZL/home/.local/share/zero-lab/cache/"*.ok && echo ok=true >> "$GITHUB_OUTPUT"
      - if: always() && steps.cached.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: /mnt/zl/home/.local/share/zero-lab/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: failure()
        run: grep '^{' "$ZL/tmp/e2e.log" | tail -1 > "$ZL/tmp/e2e.json"; df -h / /mnt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-e2e-logs
          path: |
            /mnt/zl/tmp/*.log
            /mnt/zl/tmp/*.json
            /mnt/zl/tmp/zl-*/*.log
            /mnt/zl/tmp/zl-*/*.png
            /mnt/zl/tmp/zl-*/argv.json

  windows-e2e:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: pwsh } }
    env: { ZL: 'D:\zl' }  # engine data (--data: one engine per data folder) + TEMP (run folders: serial.log, screenshots)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows-installer, path: dl }
      - name: Install silently (/S), per-user like a friend's double-click; app, uninstaller and shortcuts must exist
        run: |
          Start-Process (Get-Item dl\Zero-Lab-*-windows-x64-setup.exe).FullName -ArgumentList /S -Wait
          $inst = "$env:LOCALAPPDATA\Programs\Zero Lab"
          $want = "$inst\zero-lab\python\python.exe", "$inst\Uninstall Zero Lab.exe",
                  "$([Environment]::GetFolderPath('Programs'))\Zero Lab.lnk", "$([Environment]::GetFolderPath('Desktop'))\Zero Lab.lnk"
          $missing = $want | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "missing after install: $missing" }
      - id: img
        shell: bash
        run: echo "name=$(python -c 'import sys; sys.path[:0] = ["app"]; import image; print(next(e["url"] for e in image.CATALOG if e["id"] == "desktop").rsplit("/", 1)[1])')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: D:\zl\data\cache
          key: ${{ runner.os }}-${{ steps.img.outputs.name }}
      - name: Start the installed engine headless, run the e2e
        run: |
          $inst = "$env:LOCALAPPDATA\Programs\Zero Lab"
          $data = "$env:ZL\data"
          New-Item -ItemType Directory -Force $data, "$env:ZL\tmp" | Out-Null
          '{"accel": "tcg", "gpu": "soft"}' | Set-Content "$data\config.json"
          $env:TEMP = $env:TMP = "$env:ZL\tmp"
          $engine = Start-Process "$inst\zero-lab\python\python.exe" -PassThru -NoNewWindow `
            -ArgumentList '-X', 'utf8', "`"$inst\zero-lab\app\server.py`"", '--port', '8642', '--data', "`"$data`"" `
            -RedirectStandardOutput "$env:ZL\tmp\engine.log" -RedirectStandardError "$env:ZL\tmp\engine-err.log"
          foreach ($i in 1..60) {
            try { Invoke-WebRequest http://127.0.0.1:8642/ -UseBasicParsing | Out-Null; break } catch {}
            if ($engine.HasExited) { Get-Content "$env:ZL\tmp\engine*.log"; throw "engine exited" }
            Start-Sleep 1
          }
          python tests/e2e.py --provision desktop --gpu soft --accel tcg | Tee-Object "$env:ZL\tmp\e2e.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Uninstall silently; shortcuts, uninstall entry and install folder must be gone
        run: |
          $inst = "$env:LOCALAPPDATA\Programs\Zero Lab"
          Get-Process | Where-Object { $_.Path -like "$inst\*" } | Stop-Process -Force  # the engine started above
          & "$inst\Uninstall Zero Lab.exe" /S  # returns at once: NSIS reruns itself from TEMP
          foreach ($i in 1..90) { if (-not (Test-Path $inst)) { break }; Start-Sleep 1 }
          $left = @($inst, "$([Environment]::GetFolderPath('Programs'))\Zero Lab.lnk",
                    "$([Environment]::GetFolderPath('Desktop'))\Zero Lab.lnk",
                    'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Zero Lab') | Where-Object { Test-Path $_ }
          if ($left) { throw "left behind after uninstall: $left" }
      - id: cached
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: if (Test-Path "$env:ZL\data\cache\*.ok") { "ok=true" >> $env:GITHUB_OUTPUT }
      - if: always() && steps.cached.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\zl\data\cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: failure()
        run: Get-Content "$env:ZL\tmp\e2e.log" | Where-Object { $_ -like '{*' } | Select-Object -Last 1 | Set-Content "$env:ZL\tmp\e2e.json"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs
          path: |
            D:\zl\tmp\*.log
            D:\zl\tmp\*.json
            D:\zl\tmp\zl-*\*.log
            D:\zl\tmp\zl-*\*.png
            D:\zl\tmp\zl-*\argv.json

  release:  # main only: publish a new version once every installer passed its e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kernel, macos-e2e, appimage-e2e, windows-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(python3 -c 'import plistlib; print(plistlib.load(open("mac/Info.plist","rb"))["CFBundleShortVersionString"])')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$V is already released"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - if: steps.v.outputs.new == 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          ls -la dist
          gh release create "v$V" --target "$GITHUB_SHA" --title "Zero Lab $V" --notes-file docs/release-notes.md \
            dist/Zero-Lab-$V-macOS-arm64.dmg dist/Zero-Lab-$V-windows-x64-setup.exe dist/Zero-Lab-$V-linux-x86_64.AppImage \
            dist/Zero-Lab-$V-kernel-source.tar dist/Zero-Lab-$V-windows-x64-sources.zip dist/Zero-Lab-$V-linux-x86_64-source.tar
