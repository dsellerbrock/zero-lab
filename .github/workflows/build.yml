# Builds every Zero Lab download (macOS dmg, Windows setup.exe, Linux AppImage) from this repository alone (inputs pinned in tools/pins.sh).
# Run it by hand (Actions → Build installers → Run workflow) or push a tag v*. It only produces
# artifacts; publishing a release stays a person's job (docs/BUILDING.md, "Releasing").
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools
      - run: python3 -m unittest discover -s tests

  kernel:  # the Pi OS 6.18.50 kernel with virtio built in; rebuilt only when its recipe changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: kernel/kernel8-virtio.img
          key: kernel-${{ hashFiles('kernel/config', 'kernel/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ZL_JOBS=4 kernel/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: kernel, path: kernel/kernel8-virtio.img, if-no-files-found: error }
      - name: The kernel's GPL source (a release asset of its own; 157 MB)
        run: |
          kernel/build.sh source
          V=$(python3 -c 'import plistlib; print(plistlib.load(open("mac/Info.plist","rb"))["CFBundleShortVersionString"])')
          tar -cf "Zero-Lab-$V-kernel-source.tar" kernel/src kernel/build.sh kernel/config
      - uses: actions/upload-artifact@v4
        with: { name: kernel-source, path: Zero-Lab-*-kernel-source.tar, if-no-files-found: error }

  macos:  # Zero-Lab-<v>-macOS-arm64.dmg (needs the macOS 26 SDK: an Apple Silicon macOS 26+ runner)
    needs: [test, kernel]
    runs-on: macos-latest  # macOS 26 on Apple Silicon since mid-2026; the first step checks
    steps:
      - name: Runner is Apple Silicon with macOS 26+
        run: |
          sw_vers; uname -m; xcrun --show-sdk-version
          [ "$(uname -m)" = arm64 ] && [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ] && [ "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 26 ]
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel }
      - run: brew install meson ninja pkg-config glib pixman libslirp librsvg
      - run: ZL_JOBS=3 mac/build-bundle.sh all
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, path: build/mac/Zero-Lab-*-macOS-arm64.dmg, if-no-files-found: error }

  appimage:  # Zero-Lab-<v>-linux-x86_64.AppImage + its GPL/LGPL source tar (built in ubuntu:22.04 with podman)
    needs: [test, kernel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel }
      - run: ZL_JOBS=4 tools/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            build/appimage/Zero-Lab-*-linux-x86_64.AppImage
            build/appimage/Zero-Lab-*-linux-x86_64-source.tar
          if-no-files-found: error

  windows:  # Zero-Lab-<v>-windows-x64-setup.exe (per-user install wizard) + its GPL sources zip
    needs: [test, kernel]
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44@sha256:6ad1739ac6fb30f72ecc7b62a7ca94871d1cab215e4f5174113941047e0b4ed4  # = ZL_WIN_IMAGE in tools/pins.sh
    steps:
      - run: dnf -y -q install git  # so the checkout is a git repo (the source bundle archives HEAD)
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel }
      - run: ZL_JOBS=4 tools/make-windows-installer.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/windows/Zero-Lab-*-windows-x64-setup.exe
            build/windows/Zero-Lab-*-windows-x64-sources.zip
          if-no-files-found: error
